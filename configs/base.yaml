seed: 20260831
data:
  root: outputs/dataset
  dynamic: false
  train_scenes: 64
  val_scenes: 8
  num_views: [8, 16]
  image_width: 320
  image_height: 240
  voxel_size: 0.003
  seam_sigma: 0.004
  supervision_radius: 0.012
  xyz_noise: [0.0002, 0.0010]
  normal_noise_deg: [2.0, 8.0]
  grazing_dropout_strength: 0.60
  edge_noise: 0.0015
  flying_point_probability: 0.02
  pose_translation_noise: 0.001
  pose_rotation_noise_deg: 0.5
  point_dropout: [0.0, 0.20]
  patch_dropout_probability: 0.35
  normal_sign_flip_probability: 0.25
model:
  backbone:
    name: randlanet
    randlanet:
      feature_channels: 64
      num_neighbors: 16
      num_layers: 4
      subsampling_ratio: [4, 4, 4, 4]
      encoder_channels: [16, 64, 128, 256]
      checkpoint: null
      use_batch_stats_in_eval: true
      inference_votes: 4
    utonia:
      pretrained: null
      checkpoint: weights/utonia.pth
      freeze_encoder: false
      use_flash_attention: true
      decoder_channels: [96, 96, 192, 384]
  head_hidden_channels: 128
  part_embedding_dim: 8
  use_endpoint_head: true
  use_junction_head: true
loss:
  heat: 2.0
  offset: 1.0
  tangent: 0.2
  embedding: 0.5
  focal_alpha: 0.25
  focal_gamma: 2.0
  embedding_delta_var: 0.5
  embedding_delta_dist: 1.5
train:
  epochs: 100
  batch_size: 2
  workers: 4
  learning_rate: 0.0002
  backbone_learning_rate: 0.00002
  weight_decay: 0.01
  grad_clip: 1.0
  amp: true
  bn_calibration_batches: 0
  output_dir: outputs/train
  resume: null
postprocess:
  seam_probability_threshold: 0.30
  merge_voxel: 0.002
  graph_radius: 0.006
  tangent_angle_deg: 30
  min_component_length: 0.015
  bridge_gap: 0.010
  spline_sample_spacing: 0.002
