name: seamforge3d-intel
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch=2.2.2
  - torchvision=0.17.2
  - torchaudio=2.2.2
  - cpuonly
  - numpy=1.26.4
  - scipy
  - scikit-learn
  - pip:
      - open3d==0.19.0
      - trimesh>=4.4
      - matplotlib>=3.8
      - PyYAML>=6
      - tqdm>=4.66
      - tensorboard>=2.16
      - pytest>=8
      - openvino>=2026.0
